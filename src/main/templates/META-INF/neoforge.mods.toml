# Mod metadata file. Values written in dollar-brace form are replaced at build
# time from gradle.properties (see generateModMetadata in build.gradle), so mod
# identity is edited in one place only.
# See https://docs.neoforged.net/docs/concepts/modfiles/ for the full schema.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[modproperties.${mod_id}]
# Optional: background texture for this mod's Configured config screen (see the
# In-game config editing section of README.md). Any existing texture works.
configuredBackground = "minecraft:textures/block/stone.png"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Add your mod's dependencies below. Use type = "optional" for anything the mod
# works without, and gate the code that touches it (mixins, registrations) so it
# no-ops when the dependency is absent.

# Planned interop targets for the Tensura RPG pack (docs/integrations.md).
# Optional while the repo is in planning: nothing references them yet. They
# become required once the interop code lands, and every upstream-typed call
# stays behind a ModList gate regardless (see agents/REPO.md gotchas).

[[dependencies.${mod_id}]]
modId = "ability_core"
type = "optional"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ability_hotbar"
type = "optional"
versionRange = "[1.0.0-alpha,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "skysleylines"
type = "optional"
versionRange = "[0.5.6,)"
ordering = "AFTER"
side = "BOTH"
